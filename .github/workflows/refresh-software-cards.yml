name: Refresh from the CV database

# Everything in README.md — bio, links, publications, software — is rendered
# from nstarman/nstarman.github.io, which is the single source of truth. This
# regenerates it, so an edit there reaches this profile without anyone touching
# a second copy.
#
# It also rebuilds the software card SVGs, whose star pills are baked in and go
# stale on their own.

on:
  schedule:
    - cron: "0 6 1 * *"  # 06:00 UTC on the 1st of each month
  workflow_dispatch:
  repository_dispatch:
    types: [data-changed]   # fired by the site repo when data/ changes

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-from-database
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DATA_REF: master
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render README and cards from the database
        run: |
          python3 scripts/build_readme.py
          python3 scripts/make_software_cards.py

      # main requires pull requests and verified signatures, so this cannot push.
      # Files go through the contents API instead, which GitHub signs, onto a
      # branch that carries a single open PR.
      - name: Open a PR if anything changed
        env:
          BRANCH: chore/refresh-database
        run: |
          changed=$(git diff --name-only -- README.md assets/cards)
          if [ -z "$changed" ]; then
            echo "Nothing changed."
            exit 0
          fi
          echo "Changed:"; echo "$changed" | sed 's/^/  /'

          repo=${{ github.repository }}
          base=$(git rev-parse HEAD)

          # Start the branch from the commit this ran against, or move it there.
          gh api "repos/$repo/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$base" \
            || gh api -X PATCH "repos/$repo/git/refs/heads/$BRANCH" -f sha="$base" -F force=true

          for f in $changed; do
            sha=$(gh api "repos/$repo/contents/$f?ref=$BRANCH" -q .sha 2>/dev/null || true)
            gh api -X PUT "repos/$repo/contents/$f" \
              -f message="Refresh $f from the CV database" \
              -f branch="$BRANCH" \
              -f content="$(base64 < "$f" | tr -d '\n')" \
              ${sha:+-f sha="$sha"} --silent
          done

          gh pr view "$BRANCH" --json state -q .state 2>/dev/null | grep -q OPEN \
            || gh pr create --base "${{ github.ref_name }}" --head "$BRANCH" \
                 --title "Refresh from the CV database" \
                 --body "Rendered from the database on nstarman.github.io@$DATA_REF by .github/workflows/refresh-software-cards.yml."
